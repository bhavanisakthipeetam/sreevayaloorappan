<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a0d"/>
      <stop offset="60%" stop-color="#1e3a24"/>
      <stop offset="100%" stop-color="#2e5035"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#f0d98a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f0d98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="700" fill="url(#sky)"/>
  <rect width="900" height="700" fill="url(#moonGlow)"/>
  
  <!-- Stars -->
  <g fill="#f0d98a" opacity="0.4">
    <circle cx="100" cy="60" r="1.2"/>
    <circle cx="200" cy="40" r="1"/>
    <circle cx="320" cy="80" r="1.5"/>
    <circle cx="450" cy="30" r="1"/>
    <circle cx="580" cy="55" r="1.3"/>
    <circle cx="700" cy="45" r="1"/>
    <circle cx="820" cy="70" r="1.4"/>
    <circle cx="150" cy="100" r="0.8"/>
    <circle cx="380" cy="50" r="0.9"/>
    <circle cx="650" cy="90" r="1.1"/>
    <circle cx="780" cy="35" r="0.8"/>
  </g>

  <!-- Moon -->
  <circle cx="750" cy="80" r="28" fill="#f0d98a" opacity="0.12"/>
  <circle cx="750" cy="80" r="22" fill="#f0d98a" opacity="0.08"/>
  <circle cx="758" cy="76" r="18" fill="#1e3a24" opacity="0.6"/>

  <!-- Distant mountain silhouettes -->
  <polygon points="0,380 120,200 240,320 360,180 480,280 600,160 720,240 840,150 900,200 900,700 0,700" fill="#112215" opacity="0.9"/>
  <polygon points="0,420 80,280 200,360 300,240 420,320 540,200 660,290 780,220 900,260 900,700 0,700" fill="#0d1f0f" opacity="0.9"/>
  
  <!-- Forest tree line -->
  <g fill="#0a1a0d">
    <!-- Trees left -->
    <polygon points="30,460 55,340 80,460"/>
    <polygon points="60,480 90,350 120,480"/>
    <polygon points="10,490 40,380 70,490"/>
    <!-- Trees right -->
    <polygon points="820,455 845,335 870,455"/>
    <polygon points="845,475 875,345 905,475"/>
    <polygon points="800,480 830,370 860,480"/>
    <polygon points="860,460 890,360 920,460"/>
  </g>

  <!-- Temple base platform -->
  <rect x="250" y="560" width="400" height="20" fill="#9a7828" opacity="0.6"/>
  <rect x="270" y="545" width="360" height="18" fill="#c9952a" opacity="0.4"/>
  <rect x="290" y="532" width="320" height="16" fill="#9a7828" opacity="0.35"/>

  <!-- Temple main structure -->
  <rect x="330" y="440" width="240" height="120" fill="#1a3020" stroke="#9a7828" stroke-width="1" opacity="0.9"/>

  <!-- Temple gopuram tiers (stacked) -->
  <!-- Tier 5 base -->
  <polygon points="450,220 570,440 330,440" fill="#1e3a24" stroke="#9a7828" stroke-width="0.8"/>
  <!-- Tier 4 -->
  <polygon points="450,255 555,425 345,425" fill="#244530" stroke="#c9952a" stroke-width="0.6"/>
  <!-- Tier 3 -->
  <polygon points="450,290 538,408 362,408" fill="#1e3a24" stroke="#9a7828" stroke-width="0.6"/>
  <!-- Tier 2 -->
  <polygon points="450,320 520,390 380,390" fill="#244530" stroke="#c9952a" stroke-width="0.5"/>
  <!-- Tier 1 -->
  <polygon points="450,350 505,375 395,375" fill="#1e3a24"/>
  <!-- Finial kalasam -->
  <ellipse cx="450" cy="218" rx="12" ry="16" fill="#c9952a" opacity="0.9"/>
  <ellipse cx="450" cy="210" rx="8" ry="10" fill="#d4a843" opacity="0.9"/>
  <ellipse cx="450" cy="204" rx="5" ry="7" fill="#f0d98a" opacity="0.8"/>
  <circle cx="450" cy="200" r="5" fill="#d4a843"/>

  <!-- Temple door and details -->
  <rect x="420" y="490" width="32" height="50" fill="#050d07" rx="2"/>
  <path d="M420 510 Q436 496 452 510" fill="#c9952a" opacity="0.5"/>
  
  <!-- Windows -->
  <rect x="345" y="465" width="20" height="25" fill="#050d07" rx="1"/>
  <rect x="535" y="465" width="20" height="25" fill="#050d07" rx="1"/>
  
  <!-- Decorative carvings lines on temple -->
  <line x1="330" y1="480" x2="570" y2="480" stroke="#9a7828" stroke-width="0.8" opacity="0.4"/>
  <line x1="330" y1="510" x2="570" y2="510" stroke="#9a7828" stroke-width="0.8" opacity="0.3"/>

  <!-- Temple glow/light -->
  <ellipse cx="450" cy="480" rx="180" ry="60" fill="url(#glow)" filter="url(#blur)"/>
  
  <!-- Lamp/diya glow on steps -->
  <circle cx="360" cy="548" r="6" fill="#d4a843" opacity="0.6" filter="url(#blur)"/>
  <circle cx="540" cy="548" r="6" fill="#d4a843" opacity="0.6" filter="url(#blur)"/>
  <circle cx="360" cy="548" r="2" fill="#f0d98a" opacity="0.9"/>
  <circle cx="540" cy="548" r="2" fill="#f0d98a" opacity="0.9"/>

  <!-- Ground/foreground vegetation -->
  <rect x="0" y="640" width="900" height="60" fill="#060e07"/>
  <g fill="#0d1f0f">
    <polygon points="0,640 25,595 50,640"/>
    <polygon points="40,640 70,590 100,640"/>
    <polygon points="800,640 825,595 850,640"/>
    <polygon points="850,640 875,590 900,640"/>
  </g>
  
  <!-- Foreground grass -->
  <g stroke="#1e3a24" stroke-width="1.5" opacity="0.6">
    <path d="M80 660 Q85 640 88 655"/>
    <path d="M160 658 Q165 638 168 653"/>
    <path d="M700 659 Q705 639 708 654"/>
    <path d="M800 661 Q805 641 808 656"/>
  </g>
  
  <!-- Subtle gold shimmer on kalasam -->
  <circle cx="450" cy="200" r="12" fill="#d4a843" opacity="0.08" filter="url(#blur)"/>
  
  <!-- Text overlay hint -->
  <text x="450" y="620" text-anchor="middle" font-family="serif" font-size="13" fill="#c9952a" opacity="0.35" letter-spacing="4">· VAYALOOR KSHETRAM ·</text>
</svg>
